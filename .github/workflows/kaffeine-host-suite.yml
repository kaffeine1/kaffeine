name: kaffeine host suite

# Only when the bridge, its host tests or the AROS sources that they build
# or read change: the .conf files and the native functions of the
# libraries that test_thunk_registrations.py checks, and the dos and
# utility sources and DOS/Intuition headers that the tests compile. On a pull
# request a new push stops the run of the old one; on master a run that
# has started goes to its end.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/kaffeine-host-suite.yml'
      - 'rom/kaffeine/**'
      - 'developer/debug/test/kaffeine_host/**'
      - 'developer/debug/test/kaffeine_*_host/**'
      - 'developer/debug/test/dos_process_host/**'
      - 'developer/debug/test/intuition_screenposition_host/**'
      - 'compiler/include/dos/**'
      - 'compiler/include/intuition/screens.h'
      - 'rom/dos/**'
      - 'rom/exec/**'
      - 'rom/graphics/**'
      - 'rom/intuition/**'
      - 'rom/timer/**'
      - 'rom/utility/**'
      - 'workbench/libs/gadtools/**'
      - 'workbench/libs/locale/**'
      - 'workbench/libs/mathieee*/**'
      - 'workbench/libs/workbench/**'
      - 'workbench/devs/diskimage/include/amigaos/inline/Picasso96API_protos.h'
  push:
    branches:
      - master
    paths:
      - '.github/workflows/kaffeine-host-suite.yml'
      - 'rom/kaffeine/**'
      - 'developer/debug/test/kaffeine_host/**'
      - 'developer/debug/test/kaffeine_*_host/**'
      - 'developer/debug/test/dos_process_host/**'
      - 'developer/debug/test/intuition_screenposition_host/**'
      - 'compiler/include/dos/**'
      - 'compiler/include/intuition/screens.h'
      - 'rom/dos/**'
      - 'rom/exec/**'
      - 'rom/graphics/**'
      - 'rom/intuition/**'
      - 'rom/timer/**'
      - 'rom/utility/**'
      - 'workbench/libs/gadtools/**'
      - 'workbench/libs/locale/**'
      - 'workbench/libs/mathieee*/**'
      - 'workbench/libs/workbench/**'
      - 'workbench/devs/diskimage/include/amigaos/inline/Picasso96API_protos.h'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  kaffeine-host-suite:
    name: kaffeine host suite (Linux, GCC)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out the Moira submodule
        run: git submodule update --init rom/kaffeine/Moira

      - name: Show compilers
        run: |
          gcc --version | head -n 1
          g++ --version | head -n 1
          python3 --version

      - name: Build the host tests
        run: make -C developer/debug/test/kaffeine_host -j"$(nproc)" all

      # Without NDK_FD_DIR and AROS_FD_DIR, test_thunk_registrations.py
      # checks the manual tables against the AROS .conf files in the tree.
      # Line-buffered output keeps the last lines of a test that crashes.
      - name: Run the host tests
        run: make -C developer/debug/test/kaffeine_host test RUNNER="stdbuf -oL -eL"

      - name: Check native DOS hunk dispatch and cleanup
        run: |
          make -C developer/debug/test/dos_process_host
          make -C developer/debug/test/dos_process_host test-sanitize

      - name: Check native Intuition ScreenPosition modes and bounds
        run: |
          make -C developer/debug/test/intuition_screenposition_host
          make -C developer/debug/test/intuition_screenposition_host test-sanitize

      - name: Run standalone compatibility suites
        shell: bash
        env:
          CC: gcc
          CXX: g++
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          for suite in \
            kaffeine_domain_host \
            kaffeine_dos_broker_host \
            kaffeine_domain_run_host \
            kaffeine_domain_process_host \
            kaffeine_remember_host \
            kaffeine_videocontrol_host \
            kaffeine_gfxbase_host \
            kaffeine_paint_host \
            kaffeine_paint_hook_host \
            kaffeine_process_integration_host
          do
            runner="developer/debug/test/$suite/run_tests.py"
            source_dir="$GITHUB_WORKSPACE/rom/kaffeine"
            extra_args=()
            if [[ "$suite" == kaffeine_paint_host ]]; then
              source_dir="$GITHUB_WORKSPACE"
              extra_args+=(--oracle)
            fi
            python3 "$runner" \
              --source-dir "$source_dir" "${extra_args[@]}" \
              --build-dir "$RUNNER_TEMP/kaffeine-standalone/$suite/normal"
            python3 "$runner" --sanitize \
              --source-dir "$source_dir" "${extra_args[@]}" \
              --build-dir "$RUNNER_TEMP/kaffeine-standalone/$suite/sanitized"
          done
